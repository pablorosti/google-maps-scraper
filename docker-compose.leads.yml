# Long-running province lead scrape. Start it with ./leads.sh, which sets
# PROVINCIA, TOTAL and POR_RUBRO. Progress lives in ./leads-output, so the
# container can be restarted or recreated at any time and it resumes.
services:
  leadsgen:
    build: .
    image: google-maps-scraper-leads
    entrypoint: ["leadsgen"]
    command:
      - "-provincia=${PROVINCIA:?set PROVINCIA}"
      - "-total=${TOTAL:-100000}"
      - "-por-rubro=${POR_RUBRO:-0}"
      - "-rubros=${RUBROS:-}"
      - "-c=${CONCURRENCY:-4}"
      - "-proxies-file=${PROXIES_FILE:-}"
      - "-out=/data"
      - "-carpeta=${CARPETA:-}"
      - "-wait-when-done"
    volumes:
      - ./leads-output:/data
    environment:
      DISABLE_TELEMETRY: "1"
    # Restart after crashes, OOM kills, Docker restarts and host reboots.
    restart: unless-stopped
    # Reap orphaned Chromium processes.
    init: true
    shm_size: "2gb"
    # Chromium keeps its profile and disk cache in /tmp and rewrites them
    # constantly (GBs per hour). On disk that churn grows Docker's virtual disk
    # file on the host, which never shrinks, until the host disk is full; in
    # RAM it costs nothing.
    tmpfs:
      - /tmp:size=1g,mode=1777
    # Cap RAM so leaking Chromium gets this container OOM-killed (and restarted,
    # resuming) instead of freezing the whole Docker/WSL VM.
    mem_limit: "${MEM_LIMIT:-8g}"
    memswap_limit: "${MEM_LIMIT:-8g}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
